"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#E92EFB)\
$os\
$username\
[](bg:#74FAFC fg:#E92EFB)\
$directory\
[](fg:#74FAFC bg:#FF5C00)\
$git_branch\
$git_status\
[](fg:#FF5C00 bg:#4BFF36)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#4BFF36 bg:#33b1ff)\
$docker_context\
[](fg:#33b1ff bg:#333333)\
$time\
[ ](fg:#333333)\
$line_break\
$character"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#1a1a1a bg:#E92EFB"
style_root = "fg:#1a1a1a bg:#E92EFB"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:#1a1a1a bg:#E92EFB"
disabled = true # Disabled by default

[directory]
style = "bold fg:#1a1a1a bg:#74FAFC"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#1a1a1a bg:#33b1ff"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#1a1a1a bg:#FF5C00"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#1a1a1a bg:#FF5C00"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#1a1a1a bg:#4BFF36"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#dfdfdf bg:#333333"
format = '[ ♥ $time ]($style)'

# 입력줄 기호. 직전 명령 성공은 초록, 실패는 분홍
[character]
success_symbol = "[❯](bold #4BFF36)"
error_symbol = "[❯](bold #ee5396)"
