schema_version: "1"
name: task-cafe-discount
description: sdd:task 가 골든 요구사항·설계 문서로 구현 계획 문서를 task 규칙대로 쓰는지 본다.
tags: [sdd, task]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /sdd:task out/ 구현 계획 문서는 out/tasks.md 에 쓴다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드가 없다. git fetch 와 origin/main 조사는 하지 않고, 바꿀 파일은 설계 문서에 적힌 경로를 쓰고 확인하지 못한 것은 "확인하지 않았다" 로 쓴다. 테스트 명령은 npm test 로 둔다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - 윤문(humanize-korean) 단계는 건너뛴다.
    - 같은 이름의 파일이 이미 있으면 묻지 말고 새로 쓴다.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: file_exists
    name: file-output
    path: out/tasks.md
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-dag-flowchart-td
    target: {source: file, path: out/tasks.md}
    pattern: '```mermaid\s*\n\s*flowchart TD'
    match: contains
  - type: regex
    name: regex-classdef-done
    target: {source: file, path: out/tasks.md}
    pattern: 'classDef done fill:#1f6feb,stroke:#1f6feb,color:#ffffff'
    match: contains
  - type: regex
    name: regex-classdef-todo
    target: {source: file, path: out/tasks.md}
    pattern: 'classDef todo fill:#cfe2ff,stroke:#1f6feb,color:#0b1f44'
    match: contains
  - type: regex
    name: regex-no-empty-class-line
    target: {source: file, path: out/tasks.md}
    pattern: '^\s*class\s+(done|todo)\s*$'
    flags: m
    match: not_contains
  - type: regex
    name: regex-task-heading
    target: {source: file, path: out/tasks.md}
    pattern: '^### T1 '
    flags: m
    match: contains
  - type: regex
    name: regex-checkbox
    target: {source: file, path: out/tasks.md}
    pattern: '^- \[ \] 완료'
    flags: m
    match: contains
  - type: regex
    name: regex-no-decision-markers
    target: {source: file, path: out/tasks.md}
    pattern: '@(결정|해석|초안|미정|확정)'
    match: not_contains
  - type: regex
    name: regex-no-summary-heading
    target: {source: file, path: out/tasks.md}
    pattern: '^#+ .*(요약|결론)'
    flags: m
    match: not_contains
  - type: llm
    name: llm-write-once
    focus: {source: file, path: out/tasks.md}
    criteria: |
      요구사항·설계 문서의 규칙, 수치, 인터페이스(할인 한도 1,500원, 분담 70%, 함수 시그니처)를 옮겨 적지 않고 "요구사항 1 인수 조건 1", "design.md 컴포넌트 SettlementJob" 처럼 가리킨다. 같은 내용이 두 작업에 반복되지 않는다. 완료 확인에는 실제로 돌릴 명령이 있다. 모두 맞으면 PASS.
  - type: llm
    name: llm-trace-covered
    focus: {source: file, path: out/tasks.md}
    criteria: |
      설계 문서 요구사항 추적 표의 다섯 행(요구사항 1 인수 조건 1~3, 요구사항 2 인수 조건 1~2)이 모두 적어도 한 작업의 "가리키는 곳" 에 들어 있고, 첫 작업은 워킹 스켈레톤이며, DAG 화살표가 작업의 "선행" 과 맞는다. 모두 맞으면 PASS.
  - type: baseline
    name: baseline
    baseline_file: ../../baseline/current/traces/task.jsonl
    criteria: |
      묻지 않고 끝까지 진행해 out/tasks.md 를 썼고, DAG·작업 모양·가리키기를 기준 실행만큼 지켰다.
expected_outcome: out/tasks.md 맨 위에 mermaid 작업 DAG 가 있고, 그 아래 작업마다 선행·가리키는 곳·바꿀 파일·절차·완료 확인이 있다.
