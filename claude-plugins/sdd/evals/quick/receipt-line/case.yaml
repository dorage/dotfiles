schema_version: "1"
name: quick-receipt-line
description: sdd:quick 이 작은 작업의 스펙을 파일 없이 채팅 답 하나로 spec-format·quick 규칙대로 쓰는지 본다.
tags: [sdd, quick]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /sdd:quick 제휴 카페 임직원 할인을 받은 주문의 영수증에 "임직원 할인 -1,500원" 처럼 할인 금액을 한 줄로 보여 주고 싶다. 할인이 없는 주문에는 그 줄을 보여 주지 않는다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드가 없다. git fetch 와 origin/main 조사는 하지 않고, 코드 근거가 필요한 자리는 "확인하지 않았다" 로 쓴다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - 스펙은 파일로 쓰지 않고 마지막 답 하나에 모두 쓴다.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: write-none
    tool: Write
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-ears-has-marker
    target: last_message
    pattern: '^\d+\. (WHEN|IF|WHILE|WHERE|THE)(?!.*@(결정|해석|초안|미정|사실|가정|확정)).*$'
    flags: m
    match: not_contains
  - type: regex
    name: regex-numbered-only-ears
    target: last_message
    pattern: '^\d+\. (?!WHEN|IF|WHILE|WHERE|THE)'
    flags: m
    match: not_contains
  - type: regex
    name: regex-no-summary-heading
    target: last_message
    pattern: '^#+ .*(요약|결론)'
    flags: m
    match: not_contains
  - type: regex
    name: regex-group-max-5
    target: last_message
    pattern: '\*\*[A-Z]6\.'
    match: not_contains
  - type: regex
    name: regex-requirements-section
    target: last_message
    pattern: '^## 요구사항'
    flags: m
    match: contains
  - type: regex
    name: regex-ears-present
    target: last_message
    pattern: '^\d+\. (WHEN|IF|WHILE|WHERE|THE)'
    flags: m
    match: contains
  - type: llm
    name: llm-write-once
    focus: last_message
    criteria: |
      같은 내용(규칙, 수치, 결정의 답)이 답 두 곳에 반복되지 않고, 설계 절은 요구사항을 번호로 가리킨다. 요약·결론 블록이 따로 없다. 예시에는 실제 숫자(예: 1,500원)가 있다. 모두 맞으면 PASS.
  - type: llm
    name: llm-master-sentence-kept
    focus: last_message
    criteria: |
      입력 설명의 마스터 문장 "할인이 없는 주문에는 그 줄을 보여 주지 않는다" 와 "임직원 할인 -1,500원" 표시 모양이 뜻을 바꾸지 않은 채 인수 조건이나 업무 규칙에 들어 있고 @결정 표기가 붙어 있다. 맞으면 PASS.
  - type: baseline
    name: baseline
    baseline_file: ../../baseline/current/traces/quick.jsonl
    criteria: |
      파일을 만들지 않고 묻지 않은 채 스펙을 채팅 답 하나로 냈고, 결정·요구사항·설계 모양을 기준 실행만큼 지켰다.
expected_outcome: 마지막 답에 필요한 결정(있으면), 요구사항(EARS 인수 조건과 마커), 작은 설계가 있다.
