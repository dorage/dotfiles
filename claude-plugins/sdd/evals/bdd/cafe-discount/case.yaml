schema_version: "1"
name: bdd-cafe-discount
description: sdd:bdd 가 골든 요구사항·설계 문서로 Gherkin 시나리오를 bdd 규칙대로 쓰는지 본다.
tags: [sdd, bdd]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /sdd:bdd out/ 시나리오는 out/features/ 아래에 쓴다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드가 없다. git fetch 와 origin/main 조사는 하지 않는다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - 윤문(humanize-korean) 단계는 건너뛴다.
    - 같은 이름의 파일이 이미 있으면 묻지 말고 새로 쓴다.
    - 스킬이 끝난 뒤 마지막으로 이 명령을 그대로 실행한다: find out/features -name '*.feature' | sort | xargs cat > out/features-all.txt
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: file_exists
    name: file-output
    path: out/features/**/*.feature
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-kebab-file-names
    target: files
    pattern: 'features/[^\n]*[A-Z_ ][^\n]*\.feature$'
    flags: m
    match: not_contains
  - type: regex
    name: regex-korean-keywords
    target: {source: file, path: out/features-all.txt}
    pattern: '^# language: ko'
    flags: m
    match: contains
  - type: regex
    name: regex-no-english-blocks
    target: {source: file, path: out/features-all.txt}
    pattern: '^\s*(Feature|Background|Scenario|Scenario Outline|Examples):'
    flags: m
    match: not_contains
  - type: regex
    name: regex-tagged-scenario
    target: {source: file, path: out/features-all.txt}
    pattern: '^\s*@(결정|해석|초안|미정|확정)\s*\n\s*시나리오( 개요)?:'
    flags: m
    match: contains
  - type: regex
    name: regex-every-scenario-tagged
    target: {source: file, path: out/features-all.txt}
    pattern: '^(?!\s*@)[^\n]*\n\s*시나리오( 개요)?:'
    flags: m
    match: not_contains
  - type: llm
    name: llm-write-once
    focus: {source: file, path: out/features-all.txt}
    criteria: |
      시나리오는 설계 문서 요구사항 추적 표에서 테스트 층이 E2E·통합인 인수 조건(요구사항 1 인수 조건 1·2, 요구사항 2 인수 조건 1·2)만 다루고, 단위 층인 요구사항 1 인수 조건 3 만을 위한 시나리오는 없다. 같은 행동을 두 시나리오가 반복하지 않는다. 스텝에는 실제 숫자(5,900원, 1,500원, 8,800원 같은)가 있고 "그러면" 결과를 확인할 수 있다. 모두 맞으면 PASS.
  - type: llm
    name: llm-no-invented-behavior
    focus: {source: file, path: out/features-all.txt}
    criteria: |
      요구사항 문서의 인수 조건과 업무 규칙에 없는 행동을 시나리오로 더하지 않았고, 요구사항 문서의 결정 답(잔마다 할인, 회사 70% 분담, 원 미만 버림)을 바꾸지 않았다. 시나리오마다 마커 태그가 하나씩 있다. 모두 맞으면 PASS.
  - type: baseline
    name: baseline
    baseline_file: ../../baseline/current/traces/bdd.jsonl
    criteria: |
      묻지 않고 끝까지 진행해 out/features/ 아래에 시나리오를 썼고, 파일 구성·한국어 키워드·태그를 기준 실행만큼 지켰다.
expected_outcome: out/features/ 아래에 한국어 키워드와 마커 태그가 있는 .feature 파일이 생긴다.
