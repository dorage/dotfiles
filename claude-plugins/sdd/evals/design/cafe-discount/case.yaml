schema_version: "1"
name: design-cafe-discount
description: sdd:design 이 골든 요구사항 문서로 설계 문서를 spec-format·design 규칙대로 쓰는지 본다.
tags: [sdd, design]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /sdd:design out/requirements.md 설계 문서는 같은 폴더의 out/design.md 에 쓴다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드가 없다. git fetch 와 origin/main 조사는 하지 않고, 코드 근거가 필요한 자리는 "확인하지 않았다" 로 쓴다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - 윤문(humanize-korean) 단계는 건너뛴다.
    - 같은 이름의 파일이 이미 있으면 묻지 말고 새로 쓴다.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: file_exists
    name: file-output
    path: out/design.md
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-no-summary-heading
    target: {source: file, path: out/design.md}
    pattern: '^#+ .*(요약|결론)'
    flags: m
    match: not_contains
  - type: regex
    name: regex-group-max-5
    target: {source: file, path: out/design.md}
    pattern: '(\*\*|\*|_)[A-Z]6\.'
    match: not_contains
  - type: regex
    name: regex-decision-has-arrow
    target: {source: file, path: out/design.md}
    pattern: '^\s*- (\*\*|\*)[S-Z]\d+\.(?!.*(->|@확정)).*$'
    flags: m
    match: not_contains
  - type: regex
    name: regex-no-requirement-groups
    target: {source: file, path: out/design.md}
    pattern: '^\s*- (\*\*|\*)[A-H]\d+\.'
    flags: m
    match: not_contains
  - type: regex
    name: regex-trace-section
    target: {source: file, path: out/design.md}
    pattern: '^## 요구사항 추적'
    flags: m
    match: contains
  - type: regex
    name: regex-architecture-diagram
    target: {source: file, path: out/design.md}
    pattern: '```mermaid\s*\n\s*flowchart LR'
    match: contains
  - type: regex
    name: regex-sequence-diagram
    target: {source: file, path: out/design.md}
    pattern: '```mermaid\s*\n\s*sequenceDiagram'
    match: contains
  - type: llm
    name: llm-write-once
    focus: {source: file, path: out/design.md}
    criteria: |
      요구사항 문서의 규칙과 수치(할인 한도 1,500원, 분담 비율 70%, 경계 행)를 설계 문서에 다시 적지 않고 "요구사항 1 인수 조건 1" 처럼 번호로 가리킨다. 같은 내용이 설계 문서 두 곳에 반복되지 않는다. 시퀀스 다이어그램 메시지에는 요구사항 문서 핵심 흐름의 실제 숫자(5,900원, 8,800원 같은)가 있다. 모두 맞으면 PASS.
  - type: llm
    name: llm-requirements-untouched
    focus: {source: file, path: out/design.md}
    criteria: |
      요구사항 문서의 결정(A1~A3)을 다시 정하거나 바꾸지 않았고, 요구사항 추적 표가 인수 조건 5개(요구사항 1의 1~3, 요구사항 2의 1~2)를 모두 한 행씩 가리킨다. 설계 결정은 D 그룹이고 제목 끝에 -> 가 있다. 모두 맞으면 PASS.
  - type: baseline
    name: baseline
    baseline_file: ../../baseline/current/traces/design.jsonl
    criteria: |
      묻지 않고 끝까지 진행해 out/design.md 를 썼고, 절 구성·결정 표기·요구사항 추적을 기준 실행만큼 지켰다.
expected_outcome: out/design.md 에 일곱 절과 꽉 찬 요구사항 추적 표가 있는 설계 문서가 생긴다.
