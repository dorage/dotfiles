# FreshRSS + hourly off-site backup to Cloudflare R2.
#
#   docker compose up -d                     # reader + backup scheduler
#   docker compose logs -f backup            # watch backup cycles
#   docker compose run --rm backup backup    # one-off backup now
#   docker compose run --rm backup restore   # restore newest snapshot from R2
#
# Configuration lives in .env (never committed - see .env.example).
name: freshrss

services:
  freshrss:
    image: freshrss/freshrss:${FRESHRSS_IMAGE_TAG:-latest}
    container_name: freshrss
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
    ports:
      - "${FRESHRSS_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Europe/Paris}
      CRON_MIN: ${CRON_MIN:-1,31}
    volumes:
      - data:/var/www/FreshRSS/data
      - extensions:/var/www/FreshRSS/extensions

  backup:
    build: ./backup
    image: freshrss-backup:local
    container_name: freshrss-backup
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
    depends_on:
      - freshrss
    environment:
      TZ: ${TZ:-Europe/Paris}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-freshrss-backup}
      R2_PREFIX: ${R2_PREFIX:-freshrss}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Both mounted read-write on purpose: sqlite3 has to open the live DB (and
      # may touch its -wal/-shm sidecars) to take a consistent snapshot, and
      # `run --rm backup restore` writes the volumes back through this service.
      - data:/volumes/data
      - extensions:/volumes/extensions

# Explicit names so compose adopts the volumes the original `docker run`
# created instead of making project-prefixed copies of them.
volumes:
  data:
    name: freshrss_data
  extensions:
    name: freshrss_extensions
